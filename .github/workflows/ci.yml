name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.14"
    steps:
      - uses: actions/checkout@v7

      - name: Check out ODP specifications
        uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-specs
          path: .conformance/odp-specs

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-groups --locked --python "${{ matrix.python }}"

      - run: make verify
        env:
          ODP_PYTHON: python

      - name: Run shared conformance harness
        run: make conformance
        env:
          ODP_SPECS_DIR: .conformance/odp-specs

      - name: Upload conformance reports
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: odp-python-conformance
          path: .conformance/reports/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Check out Node.js reference implementation
        if: matrix.python == '3.11'
        uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-node
          path: .conformance/odp-node

      - name: Set up pnpm
        if: matrix.python == '3.11'
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: Set up Node.js
        if: matrix.python == '3.11'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node.js reference implementation
        if: matrix.python == '3.11'
        run: pnpm --dir .conformance/odp-node install --frozen-lockfile

      - name: Run Node.js interoperability
        if: matrix.python == '3.11'
        run: make interoperability
        env:
          ODP_NODE_DIR: .conformance/odp-node

      - name: Upload coverage to Codecov
        if: matrix.python == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: true
          flags: unit
          name: python-3.11-unit
          use_oidc: true

      - name: Upload coverage report
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: odp-python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
